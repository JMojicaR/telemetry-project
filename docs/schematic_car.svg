<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 760" font-family="Arial, sans-serif">
  <rect width="1080" height="760" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">3-Camera Rear-View Selector — Schematic (CVBS, production)</text>
  <text x="540" y="50" text-anchor="middle" font-size="12" fill="#555">ESP32 + CD4052 · optocoupler inputs · hardened 12 V automotive power</text>

  <!-- ===================== POWER SECTION ===================== -->
  <g font-size="12">
    <text x="40" y="90" font-size="14" font-weight="bold" fill="#c0392b">POWER (12 V → 5 V)</text>
    <!-- 12V input -->
    <circle cx="50" cy="130" r="4" fill="#c0392b"/><text x="62" y="134" fill="#c0392b" font-weight="bold">+12 V (fused from ignition)</text>
    <line x1="54" y1="130" x2="54" y2="130" stroke="#c0392b" stroke-width="2"/>
    <line x1="54" y1="130" x2="100" y2="130" stroke="#333" stroke-width="1.5"/>
    <!-- Fuse -->
    <rect x="100" y="122" width="34" height="16" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <line x1="100" y1="130" x2="134" y2="130" stroke="#333" stroke-width="1.5"/>
    <text x="117" y="138" text-anchor="middle" font-size="9" fill="#333">FUSE 3A</text>
    <!-- Schottky (reverse polarity) -->
    <line x1="134" y1="130" x2="160" y2="130" stroke="#333" stroke-width="1.5"/>
    <polygon points="160,124 172,130 160,136" fill="#333"/>
    <line x1="172" y1="124" x2="172" y2="136" stroke="#333" stroke-width="1.5"/>
    <line x1="172" y1="130" x2="200" y2="130" stroke="#333" stroke-width="1.5"/>
    <text x="166" y="118" text-anchor="middle" font-size="9" fill="#333">SS54</text>
    <!-- TVS to GND -->
    <line x1="186" y1="130" x2="186" y2="175" stroke="#333" stroke-width="1.2"/>
    <polygon points="180,175 192,175 186,169" fill="#fff" stroke="#333" stroke-width="1.2"/>
    <polygon points="180,175 192,175 186,181" fill="#333"/>
    <line x1="186" y1="175" x2="186" y2="190" stroke="#333" stroke-width="1.2"/>
    <text x="200" y="185" font-size="9" fill="#333">P6KE18A TVS</text>
    <!-- Buck -->
    <line x1="200" y1="130" x2="230" y2="130" stroke="#333" stroke-width="1.5"/>
    <rect x="230" y="114" width="70" height="32" fill="#eaf2f8" stroke="#2980b9" stroke-width="1.5"/>
    <text x="265" y="128" text-anchor="middle" font-size="10" fill="#2980b9">LM2596</text>
    <text x="265" y="140" text-anchor="middle" font-size="9" fill="#2980b9">12V→5V</text>
    <line x1="300" y1="130" x2="330" y2="130" stroke="#c0392b" stroke-width="1.5"/>
    <text x="338" y="134" fill="#c0392b" font-weight="bold">+5 V → ESP32 VIN</text>
    <!-- GND rail -->
    <line x1="40" y1="215" x2="340" y2="215" stroke="#555" stroke-width="2"/>
    <text x="40" y="232" font-size="10" fill="#555">GND (chassis) — cameras, monitor, ESP32, mux all share this</text>
    <!-- filter caps -->
    <rect x="150" y="200" width="4" height="16" fill="#333"/>
    <text x="158" y="212" font-size="8" fill="#333">470µF</text>
    <rect x="320" y="200" width="4" height="16" fill="#333"/>
    <text x="328" y="212" font-size="8" fill="#333">100µF</text>
  </g>

  <!-- ===================== SIGNAL INPUTS (optocouplers) ===================== -->
  <g font-size="12">
    <text x="40" y="275" font-size="14" font-weight="bold" fill="#c0392b">SIGNALS (12 V → 3.3 V, optocoupler PC817 ×3)</text>
    <!-- reverse -->
    <circle cx="50" cy="315" r="4" fill="#c0392b"/><text x="62" y="319">Reverse 12 V</text>
    <line x1="54" y1="315" x2="90" y2="315" stroke="#333" stroke-width="1.5"/>
    <rect x="90" y="299" width="16" height="32" fill="#fff" stroke="#333" stroke-width="1.5"/>  <!-- resistor -->
    <text x="98" y="293" text-anchor="middle" font-size="8">1k</text>
    <line x1="106" y1="315" x2="130" y2="315" stroke="#333" stroke-width="1.5"/>
    <rect x="130" y="303" width="44" height="24" fill="#fdf2e9" stroke="#333" stroke-width="1.5"/>
    <text x="152" y="318" text-anchor="middle" font-size="8">PC817</text>
    <line x1="174" y1="315" x2="230" y2="315" stroke="#2980b9" stroke-width="1.5"/>
    <text x="236" y="319" fill="#2980b9">→ GPIO18</text>
    <!-- left -->
    <circle cx="50" cy="350" r="4" fill="#c0392b"/><text x="62" y="354">Left turn 12 V</text>
    <line x1="54" y1="350" x2="90" y2="350" stroke="#333" stroke-width="1.5"/>
    <rect x="90" y="334" width="16" height="32" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="98" y="328" text-anchor="middle" font-size="8">1k</text>
    <line x1="106" y1="350" x2="130" y2="350" stroke="#333" stroke-width="1.5"/>
    <rect x="130" y="338" width="44" height="24" fill="#fdf2e9" stroke="#333" stroke-width="1.5"/>
    <text x="152" y="353" text-anchor="middle" font-size="8">PC817</text>
    <line x1="174" y1="350" x2="230" y2="350" stroke="#2980b9" stroke-width="1.5"/>
    <text x="236" y="354" fill="#2980b9">→ GPIO19</text>
    <!-- right -->
    <circle cx="50" cy="385" r="4" fill="#c0392b"/><text x="62" y="389">Right turn 12 V</text>
    <line x1="54" y1="385" x2="90" y2="385" stroke="#333" stroke-width="1.5"/>
    <rect x="90" y="369" width="16" height="32" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="98" y="363" text-anchor="middle" font-size="8">1k</text>
    <line x1="106" y1="385" x2="130" y2="385" stroke="#333" stroke-width="1.5"/>
    <rect x="130" y="373" width="44" height="24" fill="#fdf2e9" stroke="#333" stroke-width="1.5"/>
    <text x="152" y="388" text-anchor="middle" font-size="8">PC817</text>
    <line x1="174" y1="385" x2="230" y2="385" stroke="#2980b9" stroke-width="1.5"/>
    <text x="236" y="389" fill="#2980b9">→ GPIO23</text>
    <text x="40" y="412" font-size="9" fill="#555">PC817: pin1 (LED anode) ← 12 V via 1k · pin2 (cathode) → GND · pin4 (collector) → GPIO · pin3 (emitter) → GND</text>
  </g>

  <!-- ===================== ESP32 ===================== -->
  <g font-size="11">
    <rect x="420" y="285" width="180" height="230" fill="#f0fbf0" stroke="#27ae60" stroke-width="2"/>
    <text x="510" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ESP32 DevKit</text>
    <text x="510" y="322" text-anchor="middle" font-size="9" fill="#555">(runs camera_selector.ino)</text>
    <text x="428" y="345" fill="#333">18 · Reverse in (PULLUP)</text>
    <text x="428" y="365" fill="#333">19 · Left turn in (PULLUP)</text>
    <text x="428" y="385" fill="#333">23 · Right turn in (PULLUP)</text>
    <text x="428" y="405" fill="#333">14 · Manual button (PULLUP)</text>
    <text x="428" y="430" fill="#2980b9">25 · → CD4052 S0</text>
    <text x="428" y="450" fill="#2980b9">26 · → CD4052 S1</text>
    <text x="428" y="475" fill="#c0392b">21 · Power LED</text>
    <text x="428" y="495" fill="#c0392b">27/32/33 · Cam LEDs</text>
  </g>
  <!-- button -->
  <g font-size="10">
    <line x1="420" y1="405" x2="360" y2="405" stroke="#333" stroke-width="1.2"/>
    <rect x="300" y="397" width="60" height="16" fill="#fff" stroke="#333" stroke-width="1.2"/>
    <text x="330" y="409" text-anchor="middle" font-size="8">BTN→GND</text>
  </g>

  <!-- ===================== VIDEO MUX ===================== -->
  <g font-size="11">
    <rect x="680" y="285" width="220" height="210" fill="#fdf6e3" stroke="#f39c12" stroke-width="2"/>
    <text x="790" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#f39c12">CD4052 (analog mux)</text>
    <text x="790" y="322" text-anchor="middle" font-size="9" fill="#555">one half of dual 4:1</text>
    <text x="688" y="345" fill="#333">Y0 ← CAM1 (CENTER)</text>
    <text x="688" y="365" fill="#333">Y1 ← CAM2 (LEFT)</text>
    <text x="688" y="385" fill="#333">Y2 ← CAM3 (RIGHT)</text>
    <text x="688" y="405" fill="#999">Y3 · spare</text>
    <text x="688" y="430" fill="#2980b9">S0 ← GPIO25</text>
    <text x="688" y="450" fill="#2980b9">S1 ← GPIO26</text>
    <text x="688" y="475" fill="#c0392b">COM → video buffer → monitor</text>
    <!-- select truth table -->
    <text x="688" y="493" font-size="8" fill="#555">S0S1: 00=CENTER · 01=LEFT · 10=RIGHT</text>
  </g>
  <!-- cameras -->
  <g font-size="10">
    <rect x="620" y="330" width="58" height="18" fill="#fff" stroke="#333" stroke-width="1.2"/>
    <text x="649" y="343" text-anchor="middle" font-size="8">CAM1 center</text>
    <rect x="620" y="352" width="58" height="18" fill="#fff" stroke="#333" stroke-width="1.2"/>
    <text x="649" y="365" text-anchor="middle" font-size="8">CAM2 left</text>
    <rect x="620" y="374" width="58" height="18" fill="#fff" stroke="#333" stroke-width="1.2"/>
    <text x="649" y="387" text-anchor="middle" font-size="8">CAM3 right</text>
  </g>
  <!-- monitor -->
  <g font-size="10">
    <rect x="700" y="530" width="150" height="40" fill="#fff" stroke="#333" stroke-width="1.5"/>
    <text x="775" y="548" text-anchor="middle" font-size="10">7" CVBS monitor</text>
    <text x="775" y="562" text-anchor="middle" font-size="8">AV1 in (75 Ω)</text>
    <line x1="790" y1="495" x2="790" y2="530" stroke="#c0392b" stroke-width="1.5"/>
    <rect x="770" y="480" width="40" height="15" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="790" y="491" text-anchor="middle" font-size="7">2N3904 buf</text>
  </g>

  <!-- ===================== LEDS ===================== -->
  <g font-size="10">
    <rect x="420" y="560" width="480" height="80" fill="#fbfbfb" stroke="#ccc" stroke-width="1"/>
    <text x="430" y="578" font-size="11" font-weight="bold" fill="#333">Status LEDs (active HIGH: GPIO → 330 Ω → LED → GND)</text>
    <circle cx="440" cy="605" r="7" fill="#27ae60"/><text x="452" y="609">Power</text>
    <circle cx="530" cy="605" r="7" fill="#f39c12"/><text x="542" y="609">Center</text>
    <circle cx="630" cy="605" r="7" fill="#2980b9"/><text x="642" y="609">Left</text>
    <circle cx="730" cy="605" r="7" fill="#8e44ad"/><text x="742" y="609">Right</text>
    <text x="430" y="632" font-size="9" fill="#555">Startup self-test sweeps the mux and lights each LED so wiring can be verified without a laptop.</text>
  </g>

  <!-- ===================== NOTES ===================== -->
  <g font-size="10">
    <text x="40" y="700" font-weight="bold" fill="#333">Wiring checklist</text>
    <text x="40" y="718" fill="#555">· All grounds common. · Cameras + monitor on 12 V (fused). · ESP32 on 5 V from buck.</text>
    <text x="40" y="734" fill="#555">· Reverse/turn signals tapped at the tail-light harness, each through its own PC817 optocoupler.</text>
    <text x="40" y="750" fill="#555">· Inputs on GPIO 18/19/23 (internal pull-up). Never GPIO 34–39 for these — no pull-up.</text>
  </g>
</svg>
